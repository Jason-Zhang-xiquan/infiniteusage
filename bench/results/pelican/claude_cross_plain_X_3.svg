<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#bfe8ff"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#8fd16a" stroke-width="4"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none">
    <circle cx="130" cy="220" r="40"/>
    <circle cx="290" cy="220" r="40"/>
    <line x1="130" y1="220" x2="200" y2="170"/>
    <line x1="200" y1="170" x2="290" y2="220"/>
    <line x1="200" y1="170" x2="170" y2="220"/>
    <line x1="170" y1="220" x2="130" y2="220"/>
    <line x1="170" y1="220" x2="290" y2="220"/>
    <line x1="200" y1="170" x2="210" y2="140"/>
    <line x1="195" y1="140" x2="225" y2="140"/>
    <line x1="170" y1="220" x2="150" y2="195"/>
    <line x1="150" y1="195" x2="175" y2="195"/>
  </g>
  <circle cx="130" cy="220" r="3" fill="#333"/>
  <circle cx="290" cy="220" r="3" fill="#333"/>

  <!-- Pedal -->
  <line x1="170" y1="220" x2="185" y2="235" stroke="#333" stroke-width="4"/>
  <rect x="180" y="233" width="14" height="5" fill="#333"/>

  <!-- Pelican body -->
  <g>
    <!-- Legs -->
    <path d="M190,150 L185,195" stroke="#f4a742" stroke-width="5" fill="none"/>
    <path d="M205,150 L195,195" stroke="#f4a742" stroke-width="5" fill="none"/>

    <!-- Body -->
    <ellipse cx="200" cy="130" rx="55" ry="35" fill="#ffffff" stroke="#999" stroke-width="2"/>

    <!-- Tail -->
    <path d="M150,130 L120,120 L125,140 Z" fill="#ffffff" stroke="#999" stroke-width="2"/>

    <!-- Wing -->
    <path d="M190,110 Q220,90 245,115 Q215,125 190,130 Z" fill="#e6e6e6" stroke="#999" stroke-width="2"/>

    <!-- Neck -->
    <path d="M245,110 Q275,80 265,50 Q260,40 255,45 Q262,70 240,95 Z" fill="#ffffff" stroke="#999" stroke-width="2"/>

    <!-- Head -->
    <circle cx="263" cy="45" r="18" fill="#ffffff" stroke="#999" stroke-width="2"/>

    <!-- Beak -->
    <path d="M280,42 Q330,38 335,52 Q325,55 310,54 Q320,60 310,63 Q290,60 280,52 Z" fill="#f4a742" stroke="#c97f1f" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="268" cy="40" r="2.5" fill="#333"/>
  </g>

  <!-- Hand gripping handlebar -->
  <path d="M215,140 Q205,150 198,145" stroke="#f4a742" stroke-width="5" fill="none"/>
</svg>
