<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#bfe9f7"/>
  <line x1="0" y1="250" x2="400" y2="250" stroke="#8fc98f" stroke-width="4"/>

  <!-- Bicycle -->
  <g stroke="#333" stroke-width="4" fill="none">
    <circle cx="130" cy="230" r="40"/>
    <circle cx="280" cy="230" r="40"/>
    <line x1="130" y1="230" x2="200" y2="190"/>
    <line x1="200" y1="190" x2="280" y2="230"/>
    <line x1="200" y1="190" x2="170" y2="230"/>
    <line x1="170" y1="230" x2="130" y2="230"/>
    <line x1="170" y1="230" x2="280" y2="230"/>
    <line x1="200" y1="190" x2="210" y2="160"/>
    <line x1="210" y1="160" x2="230" y2="160"/>
    <line x1="170" y1="230" x2="150" y2="210"/>
    <line x1="150" y1="210" x2="160" y2="195"/>
  </g>
  <circle cx="130" cy="230" r="3" fill="#333"/>
  <circle cx="280" cy="230" r="3" fill="#333"/>

  <!-- Pedal -->
  <line x1="170" y1="230" x2="185" y2="245" stroke="#333" stroke-width="4"/>

  <!-- Pelican body -->
  <g>
    <!-- Legs -->
    <line x1="180" y1="190" x2="185" y2="245" stroke="#e8a33d" stroke-width="5"/>
    <line x1="195" y1="175" x2="150" y2="210" stroke="#e8a33d" stroke-width="5"/>

    <!-- Tail -->
    <path d="M150 140 Q130 150 125 165 Q145 162 160 150 Z" fill="#f2f2f2" stroke="#999" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="190" cy="150" rx="55" ry="38" fill="#ffffff" stroke="#999" stroke-width="2"/>

    <!-- Wing -->
    <path d="M190 120 Q230 110 235 150 Q210 165 175 155 Z" fill="#e6e6e6" stroke="#999" stroke-width="2"/>

    <!-- Neck -->
    <path d="M235 135 Q270 110 275 75 Q280 60 270 55 Q260 60 262 80 Q255 105 225 125 Z" fill="#ffffff" stroke="#999" stroke-width="2"/>

    <!-- Head -->
    <circle cx="272" cy="65" r="18" fill="#ffffff" stroke="#999" stroke-width="2"/>

    <!-- Beak -->
    <path d="M288 62 Q330 60 345 70 Q330 78 288 76 Z" fill="#e8a33d" stroke="#c87f20" stroke-width="2"/>
    <path d="M292 72 Q320 76 338 75 Q322 82 294 80 Z" fill="#d98c2b"/>

    <!-- Eye -->
    <circle cx="278" cy="60" r="2.5" fill="#333"/>

    <!-- Handlebar grip from beak to handlebar -->
    <line x1="230" y1="160" x2="255" y2="140" stroke="#333" stroke-width="3"/>
  </g>
</svg>
