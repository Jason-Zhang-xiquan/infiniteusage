<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<!-- iu-pelican-v3 -->
<defs>
  <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFD166"/>
    <stop offset="100%" stop-color="#06D6A0"/>
  </linearGradient>
</defs>

<!-- Sky -->
<rect x="0" y="0" width="800" height="495" fill="url(#skyGradient)"/>

<!-- Sun with exactly 8 rays -->
<g>
  <g stroke="#FB8500" stroke-width="5" stroke-linecap="round">
    <line x1="142" y1="90" x2="170" y2="90"/>
    <line x1="127" y1="127" x2="147" y2="147"/>
    <line x1="90" y1="142" x2="90" y2="170"/>
    <line x1="53" y1="127" x2="33" y2="147"/>
    <line x1="38" y1="90" x2="10" y2="90"/>
    <line x1="53" y1="53" x2="33" y2="33"/>
    <line x1="90" y1="38" x2="90" y2="10"/>
    <line x1="127" y1="53" x2="147" y2="33"/>
  </g>
  <circle cx="90" cy="90" r="45" fill="#FFB703"/>
</g>

<!-- Cloud -->
<g fill="#F1FAEE" opacity="0.8">
  <ellipse cx="600" cy="110" rx="40" ry="25"/>
  <ellipse cx="635" cy="95" rx="35" ry="28"/>
  <ellipse cx="665" cy="112" rx="38" ry="24"/>
</g>

<!-- Birds, exactly 7 -->
<g stroke="#2B2D42" stroke-width="2.5" fill="none" stroke-linecap="round">
  <path d="M138,210 Q144,200 150,210 Q156,200 162,210"/>
  <path d="M218,150 Q224,140 230,150 Q236,140 242,150"/>
  <path d="M318,180 Q324,170 330,180 Q336,170 342,180"/>
  <path d="M408,130 Q414,120 420,130 Q426,120 432,130"/>
  <path d="M488,200 Q494,190 500,200 Q506,190 512,200"/>
  <path d="M568,160 Q574,150 580,160 Q586,150 592,160"/>
  <path d="M248,240 Q254,230 260,240 Q266,230 272,240"/>
</g>

<!-- Ground -->
<rect x="0" y="495" width="800" height="105" fill="#8AC926"/>
<line x1="0" y1="495" x2="800" y2="495" stroke="#3A3A3A" stroke-width="3" stroke-dasharray="12 8"/>

<!-- Roadside sign -->
<g>
  <rect x="675" y="400" width="10" height="95" fill="#6B4F4F"/>
  <rect x="625" y="345" width="110" height="55" fill="#FFFFFF" stroke="#2B2D42" stroke-width="3"/>
  <text x="680" y="382" font-family="sans-serif" font-size="24" fill="#2B2D42" text-anchor="middle">IU-46</text>
  <!-- Ladybug on top of the sign -->
  <g>
    <ellipse cx="680" cy="340" rx="11" ry="8" fill="#D7263D"/>
    <line x1="680" y1="332" x2="680" y2="348" stroke="#1A1A1A" stroke-width="1.5"/>
    <circle cx="684" cy="334" r="4" fill="#1A1A1A"/>
    <circle cx="675" cy="337" r="1.6" fill="#1A1A1A"/>
    <circle cx="684" cy="341" r="1.6" fill="#1A1A1A"/>
    <circle cx="676" cy="344" r="1.6" fill="#1A1A1A"/>
  </g>
</g>

<!-- Bicycle -->
<g>
  <!-- Rear wheel -->
  <circle cx="300" cy="440" r="55" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  <g stroke="#5C677D" stroke-width="3">
    <line x1="310" y1="440" x2="348" y2="440"/>
    <line x1="305" y1="449" x2="324" y2="482"/>
    <line x1="295" y1="449" x2="276" y2="482"/>
    <line x1="290" y1="440" x2="252" y2="440"/>
    <line x1="295" y1="431" x2="276" y2="398"/>
    <line x1="305" y1="431" x2="324" y2="398"/>
  </g>
  <circle cx="300" cy="440" r="8" fill="#5C677D"/>

  <!-- Front wheel -->
  <circle cx="480" cy="440" r="55" fill="none" stroke="#1A1A1A" stroke-width="6"/>
  <g stroke="#5C677D" stroke-width="3">
    <line x1="490" y1="440" x2="528" y2="440"/>
    <line x1="485" y1="449" x2="504" y2="482"/>
    <line x1="475" y1="449" x2="456" y2="482"/>
    <line x1="470" y1="440" x2="432" y2="440"/>
    <line x1="475" y1="431" x2="456" y2="398"/>
    <line x1="485" y1="431" x2="504" y2="398"/>
  </g>
  <circle cx="480" cy="440" r="8" fill="#5C677D"/>

  <!-- Frame -->
  <g stroke="#8338EC" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="300" y1="440" x2="390" y2="440"/>
    <line x1="390" y1="440" x2="365" y2="345"/>
    <line x1="365" y1="345" x2="440" y2="335"/>
    <line x1="390" y1="440" x2="440" y2="335"/>
    <line x1="440" y1="335" x2="480" y2="440"/>
    <line x1="440" y1="335" x2="440" y2="305"/>
    <line x1="415" y1="305" x2="465" y2="305"/>
  </g>

  <!-- Saddle -->
  <ellipse cx="360" cy="340" rx="18" ry="7" fill="#2B2D42"/>

  <!-- Pedal crank -->
  <circle cx="390" cy="440" r="6" fill="#5C677D"/>
  <line x1="390" y1="440" x2="410" y2="455" stroke="#5C677D" stroke-width="4" stroke-linecap="round"/>
  <line x1="390" y1="440" x2="370" y2="425" stroke="#5C677D" stroke-width="4" stroke-linecap="round"/>

  <!-- Front basket with fish -->
  <rect x="450" y="300" width="55" height="38" rx="4" fill="#A5683C" stroke="#6B4423" stroke-width="2"/>
  <g>
    <path d="M465,319 Q480,305 498,319 Q480,333 465,319 Z" fill="#00B4D8"/>
    <path d="M465,319 L455,312 L455,326 Z" fill="#00B4D8"/>
    <circle cx="492" cy="315" r="1.5" fill="#0B132B"/>
  </g>
</g>

<!-- Pelican riding the bicycle -->
<g>
  <!-- Legs -->
  <line x1="350" y1="330" x2="370" y2="425" stroke="#FF9F1C" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="370" cy="425" rx="10" ry="5" fill="#FF9F1C"/>

  <!-- Tail -->
  <path d="M320,320 L290,345 L315,330 Z" fill="#ECECEC" stroke="#2B2D42" stroke-width="2"/>

  <!-- Torso -->
  <ellipse cx="355" cy="290" rx="45" ry="60" fill="#ECECEC" stroke="#2B2D42" stroke-width="2"/>

  <!-- Wing -->
  <path d="M335,250 Q375,260 365,320 Q335,310 335,250 Z" fill="#D8D8D8" stroke="#2B2D42" stroke-width="1.5"/>

  <!-- Scarf tail -->
  <path d="M300,228 L265,258 L292,244 Z" fill="#F95738"/>
  <!-- Scarf band -->
  <path d="M303,222 Q330,248 360,228 Q346,246 320,247 Q298,240 303,222 Z" fill="#F95738"/>

  <!-- Neck/Head -->
  <circle cx="328" cy="208" r="28" fill="#ECECEC" stroke="#2B2D42" stroke-width="2"/>

  <!-- Pouch under beak -->
  <path d="M350,214 Q382,236 408,214 L400,222 Q378,234 354,222 Z" fill="#F77F00"/>
  <!-- Upper beak -->
  <path d="M350,203 L412,193 L406,214 L350,214 Z" fill="#FF9F1C" stroke="#2B2D42" stroke-width="1.5"/>

  <!-- Eye -->
  <circle cx="340" cy="198" r="4" fill="#0B132B"/>
</g>
</svg>
