<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<!-- iu-pelican-v3 -->
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFD166"/>
    <stop offset="1" stop-color="#06D6A0"/>
  </linearGradient>
</defs>

<!-- sky -->
<rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>

<!-- ground -->
<rect x="0" y="500" width="800" height="100" fill="#A7C957"/>
<line x1="0" y1="500" x2="800" y2="500" stroke="#4A4E4D" stroke-width="4" stroke-dasharray="12 8"/>

<!-- sun: fill #FFB703, top-left, exactly 8 straight rays stroke #FB8500 -->
<g>
  <line x1="145" y1="100" x2="170" y2="100" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <line x1="131.8" y1="131.8" x2="149.5" y2="149.5" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="145" x2="100" y2="170" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <line x1="68.2" y1="131.8" x2="50.5" y2="149.5" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <line x1="55" y1="100" x2="30" y2="100" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <line x1="68.2" y1="68.2" x2="50.5" y2="50.5" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <line x1="100" y1="55" x2="100" y2="30" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <line x1="131.8" y1="68.2" x2="149.5" y2="50.5" stroke="#FB8500" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="40" fill="#FFB703"/>
</g>

<!-- cloud: one, fill #F1FAEE, opacity 0.8 -->
<g opacity="0.8">
  <ellipse cx="560" cy="140" rx="40" ry="25" fill="#F1FAEE"/>
  <ellipse cx="600" cy="125" rx="50" ry="30" fill="#F1FAEE"/>
  <ellipse cx="642" cy="140" rx="35" ry="22" fill="#F1FAEE"/>
</g>

<!-- birds: exactly 7, each stroke #2B2D42 -->
<g fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round">
  <path d="M135,185 q15,-16 15,0 q15,-16 15,0" transform="translate(0,0)"/>
  <path d="M200,95 q15,-16 15,0 q15,-16 15,0"/>
  <path d="M465,65 q15,-16 15,0 q15,-16 15,0"/>
  <path d="M595,155 q15,-16 15,0 q15,-16 15,0"/>
  <path d="M655,255 q15,-16 15,0 q15,-16 15,0"/>
  <path d="M370,55 q15,-16 15,0 q15,-16 15,0"/>
  <path d="M715,190 q15,-16 15,0 q15,-16 15,0"/>
</g>

<!-- roadside sign with ladybug on top -->
<g>
  <line x1="700" y1="500" x2="700" y2="430" stroke="#6D4C41" stroke-width="6"/>
  <rect x="655" y="385" width="90" height="45" rx="4" fill="#FFFFFF" stroke="#333333" stroke-width="2"/>
  <text x="700" y="413" font-family="sans-serif" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle">IU-46</text>
  <!-- ladybug: one, fill #D7263D, at top of sign -->
  <g>
    <ellipse cx="700" cy="380" rx="12" ry="9" fill="#D7263D"/>
    <line x1="700" y1="371" x2="700" y2="389" stroke="#0B132B" stroke-width="1.5"/>
    <circle cx="695" cy="376" r="1.6" fill="#0B132B"/>
    <circle cx="705" cy="383" r="1.6" fill="#0B132B"/>
    <circle cx="700" cy="372" r="5" fill="#0B132B"/>
  </g>
</g>

<!-- bicycle -->
<g>
  <!-- rear wheel: exactly 6 spokes, stroke #5C677D -->
  <g>
    <circle cx="300" cy="450" r="50" fill="none" stroke="#5C677D" stroke-width="4"/>
    <line x1="300" y1="450" x2="350" y2="450" stroke="#5C677D" stroke-width="2"/>
    <line x1="300" y1="450" x2="325" y2="406.7" stroke="#5C677D" stroke-width="2"/>
    <line x1="300" y1="450" x2="275" y2="406.7" stroke="#5C677D" stroke-width="2"/>
    <line x1="300" y1="450" x2="250" y2="450" stroke="#5C677D" stroke-width="2"/>
    <line x1="300" y1="450" x2="275" y2="493.3" stroke="#5C677D" stroke-width="2"/>
    <line x1="300" y1="450" x2="325" y2="493.3" stroke="#5C677D" stroke-width="2"/>
    <circle cx="300" cy="450" r="6" fill="#5C677D"/>
  </g>
  <!-- front wheel: exactly 6 spokes, stroke #5C677D -->
  <g>
    <circle cx="460" cy="450" r="50" fill="none" stroke="#5C677D" stroke-width="4"/>
    <line x1="460" y1="450" x2="510" y2="450" stroke="#5C677D" stroke-width="2"/>
    <line x1="460" y1="450" x2="485" y2="406.7" stroke="#5C677D" stroke-width="2"/>
    <line x1="460" y1="450" x2="435" y2="406.7" stroke="#5C677D" stroke-width="2"/>
    <line x1="460" y1="450" x2="410" y2="450" stroke="#5C677D" stroke-width="2"/>
    <line x1="460" y1="450" x2="435" y2="493.3" stroke="#5C677D" stroke-width="2"/>
    <line x1="460" y1="450" x2="485" y2="493.3" stroke="#5C677D" stroke-width="2"/>
    <circle cx="460" cy="450" r="6" fill="#5C677D"/>
  </g>

  <!-- frame: #8338EC -->
  <g stroke="#8338EC" stroke-width="6" fill="none" stroke-linecap="round">
    <line x1="300" y1="450" x2="345" y2="455"/>
    <line x1="345" y1="455" x2="350" y2="375"/>
    <line x1="350" y1="375" x2="445" y2="385"/>
    <line x1="345" y1="455" x2="445" y2="385"/>
    <line x1="445" y1="385" x2="460" y2="450"/>
    <line x1="300" y1="450" x2="350" y2="375"/>
  </g>
  <!-- handlebar -->
  <g stroke="#8338EC" stroke-width="5" fill="none" stroke-linecap="round">
    <line x1="430" y1="390" x2="460" y2="375"/>
    <line x1="460" y1="375" x2="470" y2="365"/>
  </g>
  <!-- seat -->
  <ellipse cx="350" cy="372" rx="14" ry="6" fill="#333333"/>
  <!-- pedal crank -->
  <line x1="345" y1="455" x2="365" y2="470" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
  <line x1="345" y1="455" x2="325" y2="440" stroke="#333333" stroke-width="4" stroke-linecap="round"/>

  <!-- front basket with fish -->
  <path d="M430,395 L470,395 L465,420 L435,420 Z" fill="none" stroke="#6D4C41" stroke-width="3"/>
  <g>
    <!-- fish: fill #00B4D8 -->
    <ellipse cx="451" cy="408" rx="16" ry="8" fill="#00B4D8"/>
    <path d="M435,408 L422,399 L422,417 Z" fill="#00B4D8"/>
    <circle cx="460" cy="406" r="1.5" fill="#0B132B"/>
  </g>
</g>

<!-- pelican (no helmet) -->
<g>
  <!-- legs -->
  <line x1="358" y1="385" x2="345" y2="450" stroke="#F4A259" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="345" cy="455" rx="14" ry="7" fill="#F4A259"/>

  <!-- tail -->
  <path d="M310,330 L278,310 L300,348 Z" fill="#ECECEC" stroke="#3D3D3D" stroke-width="2"/>

  <!-- body -->
  <ellipse cx="380" cy="335" rx="75" ry="58" fill="#ECECEC" stroke="#3D3D3D" stroke-width="2"/>

  <!-- scarf: fill #F95738 -->
  <path d="M398,278 Q432,302 458,276 Q452,302 420,314 Q398,302 398,278 Z" fill="#F95738"/>
  <path d="M396,292 L368,312 L390,304 Z" fill="#F95738"/>

  <!-- wing -->
  <path d="M330,312 Q382,282 422,320 Q380,340 330,312 Z" fill="#D6D6D6" stroke="#3D3D3D" stroke-width="2"/>

  <!-- neck -->
  <path d="M415,292 C440,262 450,232 450,212 C462,232 470,262 445,297 Z" fill="#ECECEC" stroke="#3D3D3D" stroke-width="2"/>

  <!-- head -->
  <ellipse cx="460" cy="205" rx="30" ry="26" fill="#ECECEC" stroke="#3D3D3D" stroke-width="2"/>

  <!-- beak -->
  <path d="M450,200 L578,184 Q588,195 578,206 L460,223 Q444,215 450,200 Z" fill="#F4A259" stroke="#3D3D3D" stroke-width="2"/>

  <!-- eye: small circle fill #0B132B -->
  <circle cx="472" cy="198" r="4" fill="#0B132B"/>
</g>

</svg>
