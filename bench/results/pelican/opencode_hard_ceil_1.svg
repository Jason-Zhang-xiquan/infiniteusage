<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- iu-pelican-v3 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- sun with 8 straight rays -->
  <g stroke="#FB8500" stroke-width="4" stroke-linecap="round">
    <line x1="142" y1="90" x2="160" y2="90"/>
    <line x1="126.8" y1="53.2" x2="139.5" y2="40.5"/>
    <line x1="90" y1="38" x2="90" y2="20"/>
    <line x1="53.2" y1="53.2" x2="40.5" y2="40.5"/>
    <line x1="38" y1="90" x2="20" y2="90"/>
    <line x1="53.2" y1="126.8" x2="40.5" y2="139.5"/>
    <line x1="90" y1="142" x2="90" y2="160"/>
    <line x1="126.8" y1="126.8" x2="139.5" y2="139.5"/>
  </g>
  <circle cx="90" cy="90" r="42" fill="#FFB703"/>

  <!-- exactly 7 birds -->
  <g fill="none" stroke="#2B2D42" stroke-width="3" stroke-linecap="round">
    <path d="M 200 80 q 10 -8 20 0 q 10 -8 20 0"/>
    <path d="M 265 130 q 10 -8 20 0 q 10 -8 20 0"/>
    <path d="M 340 70 q 10 -8 20 0 q 10 -8 20 0"/>
    <path d="M 420 120 q 10 -8 20 0 q 10 -8 20 0"/>
    <path d="M 480 60 q 10 -8 20 0 q 10 -8 20 0"/>
    <path d="M 545 100 q 10 -8 20 0 q 10 -8 20 0"/>
    <path d="M 670 80 q 10 -8 20 0 q 10 -8 20 0"/>
  </g>

  <!-- one cloud -->
  <g fill="#F1FAEE" opacity="0.8">
    <circle cx="585" cy="150" r="20"/>
    <circle cx="612" cy="138" r="26"/>
    <circle cx="640" cy="150" r="20"/>
    <rect x="575" y="148" width="75" height="22" rx="11"/>
  </g>

  <!-- roadside sign -->
  <rect x="713" y="340" width="6" height="185" fill="#5C677D"/>
  <rect x="665" y="275" width="100" height="70" rx="6" fill="#F1FAEE" stroke="#2B2D42" stroke-width="3"/>
  <text x="715" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#2B2D42">IU-46</text>

  <!-- ladybug on top of the sign -->
  <g>
    <ellipse cx="715" cy="268" rx="9" ry="7" fill="#D7263D"/>
    <circle cx="715" cy="262" r="3.5" fill="#0B132B"/>
    <line x1="715" y1="261" x2="715" y2="275" stroke="#0B132B" stroke-width="1.5"/>
  </g>

  <!-- dashed ground line -->
  <line x1="0" y1="525" x2="800" y2="525" stroke="#5C677D" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- bicycle -->
  <g>
    <!-- rear wheel, 6 spokes -->
    <circle cx="290" cy="462" r="60" fill="none" stroke="#2B2D42" stroke-width="5"/>
    <g stroke="#5C677D" stroke-width="3" stroke-linecap="round">
      <line x1="290" y1="462" x2="344" y2="462"/>
      <line x1="290" y1="462" x2="317" y2="415.23"/>
      <line x1="290" y1="462" x2="263" y2="415.23"/>
      <line x1="290" y1="462" x2="236" y2="462"/>
      <line x1="290" y1="462" x2="263" y2="508.77"/>
      <line x1="290" y1="462" x2="317" y2="508.77"/>
    </g>
    <circle cx="290" cy="462" r="5" fill="#2B2D42"/>

    <!-- front wheel, 6 spokes -->
    <circle cx="520" cy="462" r="60" fill="none" stroke="#2B2D42" stroke-width="5"/>
    <g stroke="#5C677D" stroke-width="3" stroke-linecap="round">
      <line x1="520" y1="462" x2="574" y2="462"/>
      <line x1="520" y1="462" x2="547" y2="415.23"/>
      <line x1="520" y1="462" x2="493" y2="415.23"/>
      <line x1="520" y1="462" x2="466" y2="462"/>
      <line x1="520" y1="462" x2="493" y2="508.77"/>
      <line x1="520" y1="462" x2="547" y2="508.77"/>
    </g>
    <circle cx="520" cy="462" r="5" fill="#2B2D42"/>

    <!-- frame -->
    <g stroke="#8338EC" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="290" y1="462" x2="345" y2="372"/>
      <line x1="290" y1="462" x2="405" y2="462"/>
      <line x1="405" y1="462" x2="345" y2="372"/>
      <line x1="345" y1="372" x2="472" y2="352"/>
      <line x1="405" y1="462" x2="487" y2="425"/>
      <line x1="487" y1="425" x2="472" y2="352"/>
      <line x1="487" y1="425" x2="520" y2="462"/>
    </g>

    <!-- handlebar -->
    <line x1="472" y1="352" x2="500" y2="332" stroke="#2B2D42" stroke-width="5" stroke-linecap="round"/>
    <line x1="492" y1="326" x2="510" y2="340" stroke="#2B2D42" stroke-width="5" stroke-linecap="round"/>

    <!-- seat -->
    <line x1="338" y1="366" x2="356" y2="360" stroke="#2B2D42" stroke-width="7" stroke-linecap="round"/>

    <!-- crank and pedals -->
    <circle cx="405" cy="462" r="9" fill="none" stroke="#2B2D42" stroke-width="4"/>
    <line x1="405" y1="462" x2="425" y2="448" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
    <line x1="415" y1="444" x2="433" y2="452" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
    <line x1="405" y1="462" x2="385" y2="476" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- pelican -->
  <g>
    <!-- legs -->
    <line x1="372" y1="368" x2="425" y2="446" stroke="#F4A261" stroke-width="8" stroke-linecap="round"/>
    <line x1="392" y1="372" x2="385" y2="474" stroke="#F4A261" stroke-width="8" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="360" cy="330" rx="60" ry="48" fill="#FDFDFD" stroke="#2B2D42" stroke-width="3"/>

    <!-- wing -->
    <path d="M 335 320 Q 380 300 404 334 Q 378 362 335 344 Z" fill="#E5E8EC" stroke="#2B2D42" stroke-width="2.5"/>

    <!-- neck -->
    <path d="M 390 310 C 415 300 425 265 452 258" fill="none" stroke="#FDFDFD" stroke-width="26" stroke-linecap="round"/>
    <path d="M 390 310 C 415 300 425 265 452 258" fill="none" stroke="#2B2D42" stroke-width="29" stroke-linecap="round" opacity="0"/>

    <!-- head -->
    <circle cx="458" cy="252" r="20" fill="#FDFDFD" stroke="#2B2D42" stroke-width="3"/>

    <!-- beak -->
    <path d="M 472 243 L 548 268 L 470 270 Z" fill="#F4A261" stroke="#2B2D42" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="474" y1="260" x2="540" y2="267" stroke="#2B2D42" stroke-width="1.5" opacity="0.5"/>

    <!-- eye -->
    <circle cx="463" cy="247" r="4" fill="#0B132B"/>

    <!-- scarf -->
    <path d="M 400 312 Q 425 296 452 300" fill="none" stroke="#F95738" stroke-width="15" stroke-linecap="round"/>
    <path d="M 406 312 Q 382 324 378 350" fill="none" stroke="#F95738" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- front basket and fish -->
  <g>
    <path d="M 520 352 L 592 352 L 582 402 L 530 402 Z" fill="#E9C46A" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
    <line x1="531" y1="372" x2="583" y2="372" stroke="#2B2D42" stroke-width="1.8" opacity="0.55"/>
    <line x1="535" y1="352" x2="540" y2="402" stroke="#2B2D42" stroke-width="1.8" opacity="0.55"/>
    <line x1="556" y1="352" x2="556" y2="402" stroke="#2B2D42" stroke-width="1.8" opacity="0.55"/>
    <line x1="576" y1="352" x2="572" y2="402" stroke="#2B2D42" stroke-width="1.8" opacity="0.55"/>

    <!-- fish -->
    <g>
      <ellipse cx="558" cy="348" rx="23" ry="12" fill="#00B4D8" stroke="#2B2D42" stroke-width="2"/>
      <path d="M 536 348 L 518 337 L 518 359 Z" fill="#00B4D8" stroke="#2B2D42" stroke-width="2" stroke-linejoin="round"/>
      <circle cx="570" cy="344" r="2.5" fill="#0B132B"/>
    </g>
  </g>
</svg>
