    <circle cx="226" cy="450" r="75" stroke="#F4F1DE" stroke-width="3"/>
    <circle cx="554" cy="450" r="88" stroke="#27313E" stroke-width="12"/>
    <circle cx="554" cy="450" r="75" stroke="#F4F1DE" stroke-width="3"/>
  </g>
  <g stroke="#5C677D" stroke-width="2.5">
    <line x1="226" y1="450" x2="226" y2="375"/><line x1="226" y1="450" x2="291" y2="412"/>
    <line x1="226" y1="450" x2="291" y2="488"/><line x1="226" y1="450" x2="226" y2="525"/>
    <line x1="226" y1="450" x2="161" y2="488"/><line x1="226" y1="450" x2="161" y2="412"/>
    <line x1="554" y1="450" x2="554" y2="375"/><line x1="554" y1="450" x2="619" y2="412"/>
    <line x1="554" y1="450" x2="619" y2="488"/><line x1="554" y1="450" x2="554" y2="525"/>
    <line x1="554" y1="450" x2="489" y2="488"/><line x1="554" y1="450" x2="489" y2="412"/>
  </g>
  <g fill="#5C677D">
