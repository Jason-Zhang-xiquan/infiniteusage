  <g fill="none" stroke="#2B2D42" stroke-width="2.5" stroke-linecap="round">
    <path d="M235 87q8-9 16 0q8-9 16 0"/>
    <path d="M281 63q7-8 14 0q7-8 14 0"/>
    <path d="M323 105q8-9 16 0q8-9 16 0"/>
    <path d="M374 70q6-7 12 0q6-7 12 0"/>
    <path d="M419 107q7-8 14 0q7-8 14 0"/>
    <path d="M475 62q6-7 12 0q6-7 12 0"/>
    <path d="M513 145q7-8 14 0q7-8 14 0"/>
  </g>

  <!-- Low hills and the road. -->
  <path d="M0 469Q143 416 275 475Q447 417 602 474Q705 435 800 466V600H0Z" fill="#83C78A" opacity="0.6"/>
  <path d="M0 540H800V600H0Z" fill="#E9D8A6"/>
  <path d="M0 543H800" fill="none" stroke="#776B58" stroke-width="3" stroke-dasharray="12 8"/>

  <!-- Roadside sign and its tiny ladybug. -->
  <path d="M735 341v199" stroke="#6B705C" stroke-width="10" stroke-linecap="round"/>
  <rect x="665" y="343" width="126" height="75" rx="10" fill="#FFF8E7" stroke="#6B705C" stroke-width="5"/>
  <text x="728" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="bold" fill="#2B2D42">IU-46</text>
