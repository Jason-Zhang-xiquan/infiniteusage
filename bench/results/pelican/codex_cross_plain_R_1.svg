  <path d="M484 126q17 22 77 20-18 46-49 55-30-2-42-25Z" fill="#F5A95B" stroke="#CE7942" stroke-width="3"/>
  <path d="M480 120q43 1 100 19-60 13-105 5Z" fill="#F9C36A" stroke="#CE7942" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="464" cy="102" r="4" fill="#0B132B"/>
  <path d="M476 78q5-18 18-19" fill="none" stroke="#C7BFA9" stroke-width="3" stroke-linecap="round"/>

  <!-- Scarf and flying tails. -->
  <path d="M399 165q24 13 51-4l9 18q-29 20-58 4Z" fill="#F95738" stroke="#B93F2F" stroke-width="2"/>
  <path d="M407 177q-25 4-68-6l17 16-13 12q38 1 67-7Z" fill="#F95738" stroke="#B93F2F" stroke-width="2"/>

  <!-- Feet on the pedals and a wing reaching the handlebar. -->
  <path d="M330 308q12 36 34 44l-2 112" fill="none" stroke="#E89A50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M371 291q10 27 45 45l3 80" fill="none" stroke="#E89A50" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M350 480q13 9 26 0m30-61q13 9 26 0" fill="none" stroke="#E89A50" stroke-width="7" stroke-linecap="round"/>
  <path d="M364 232q44 15 85 35 26 12 52 32l31 10" fill="none" stroke="#FFF7DF" stroke-width="23" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M525 305q14 10 25 4" fill="none" stroke="#E89A50" stroke-width="7" stroke-linecap="round"/>
</svg>
