<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<!-- iu-pelican-v3 -->
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A scarf-wearing pelican pedals a purple bicycle past a roadside sign, with a fish in the front basket.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD166"/>
      <stop offset="1" stop-color="#06D6A0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- Sunshine: one circle and eight straight rays. -->
  <g stroke="#FB8500" stroke-width="5" stroke-linecap="round">
    <line x1="96" y1="28" x2="96" y2="13"/>
    <line x1="96" y1="172" x2="96" y2="187"/>
    <line x1="24" y1="100" x2="9" y2="100"/>
    <line x1="168" y1="100" x2="183" y2="100"/>
    <line x1="45" y1="49" x2="34" y2="38"/>
    <line x1="147" y1="151" x2="158" y2="162"/>
    <line x1="147" y1="49" x2="158" y2="38"/>
    <line x1="45" y1="151" x2="34" y2="162"/>
  </g>
  <circle cx="96" cy="100" r="56" fill="#FFB703"/>

  <path d="M545 101c0-16 13-28 28-28 8 0 15 3 20 9 6-13 19-22 34-22 20 0 36 14 39 33 4-2 9-3 14-3 17 0 30 13 30 29 0 17-14 29-31 29H555c-17 0-30-11-30-25 0-11 8-20 20-22Z" fill="#F1FAEE" opacity="0.8"/>

