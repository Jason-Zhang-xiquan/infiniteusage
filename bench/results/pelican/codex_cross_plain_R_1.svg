  <path d="M539 343h78m-74 22h70m-54-45 2 68m28-68-3 68" stroke="#8D5A37" stroke-width="3" opacity="0.8"/>
  <path d="M558 336q25-35 48 0l18-16v32l-18-16q-23 35-48 0Z" fill="#00B4D8" stroke="#076681" stroke-width="3" stroke-linejoin="round"/>
