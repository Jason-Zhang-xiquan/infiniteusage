<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGrad)"/>

  <!-- ground -->
  <rect x="0" y="510" width="800" height="90" fill="#A7C957"/>
  <line x1="0" y1="510" x2="800" y2="510" stroke="#3A5A40" stroke-width="4" stroke-dasharray="12 8"/>

  <!-- sun -->
  <g stroke="#FB8500" stroke-width="4" stroke-linecap="round">
    <line x1="140" y1="90" x2="175" y2="90"/>
    <line x1="125" y1="55" x2="150" y2="30"/>
    <line x1="90" y1="40" x2="90" y2="5"/>
    <line x1="55" y1="55" x2="30" y2="30"/>
    <line x1="40" y1="90" x2="5" y2="90"/>
    <line x1="55" y1="125" x2="30" y2="150"/>
    <line x1="90" y1="140" x2="90" y2="175"/>
    <line x1="125" y1="125" x2="150" y2="150"/>
  </g>
  <circle cx="90" cy="90" r="45" fill="#FFB703"/>

  <!-- birds (7) -->
  <g stroke="#2B2D42" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M185,120 Q193,110 200,120 Q207,110 215,120"/>
    <path d="M245,180 Q253,170 260,180 Q267,170 275,180"/>
    <path d="M325,100 Q333,90 340,100 Q347,90 355,100"/>
    <path d="M415,150 Q423,140 430,150 Q437,140 445,150"/>
    <path d="M585,90 Q593,80 600,90 Q607,80 615,90"/>
    <path d="M665,150 Q673,140 680,150 Q687,140 695,150"/>
    <path d="M545,200 Q553,190 560,200 Q567,190 575,200"/>
  </g>

  <!-- roadside sign -->
  <line x1="650" y1="510" x2="650" y2="420" stroke="#6B4226" stroke-width="6"/>
  <rect x="600" y="380" width="100" height="50" fill="#FFFFFF" stroke="#333333" stroke-width="3"/>
  <text x="650" y="412" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#333333" text-anchor="middle">IU-46</text>

  <!-- bicycle: rear wheel -->
  <g>
    <circle cx="300" cy="460" r="55" fill="none" stroke="#222222" stroke-width="8"/>
    <g stroke="#5C677D" stroke-width="2">
      <line x1="300" y1="460" x2="300" y2="406"/>
      <line x1="300" y1="460" x2="347.7" y2="433"/>
      <line x1="300" y1="460" x2="347.7" y2="487"/>
      <line x1="300" y1="460" x2="300" y2="514"/>
      <line x1="300" y1="460" x2="252.3" y2="487"/>
      <line x1="300" y1="460" x2="252.3" y2="433"/>
    </g>
    <circle cx="300" cy="460" r="6" fill="#5C677D"/>
  </g>

  <!-- bicycle: front wheel -->
  <g>
    <circle cx="500" cy="460" r="55" fill="none" stroke="#222222" stroke-width="8"/>
    <g stroke="#5C677D" stroke-width="2">
      <line x1="500" y1="460" x2="500" y2="406"/>
      <line x1="500" y1="460" x2="547.7" y2="433"/>
      <line x1="500" y1="460" x2="547.7" y2="487"/>
      <line x1="500" y1="460" x2="500" y2="514"/>
      <line x1="500" y1="460" x2="452.3" y2="487"/>
      <line x1="500" y1="460" x2="452.3" y2="433"/>
    </g>
    <circle cx="500" cy="460" r="6" fill="#5C677D"/>
  </g>

  <!-- bicycle: frame -->
  <g stroke="#8338EC" stroke-width="7" stroke-linecap="round" fill="none">
    <line x1="300" y1="460" x2="360" y2="375"/>
    <line x1="360" y1="375" x2="470" y2="370"/>
    <line x1="300" y1="460" x2="390" y2="435"/>
    <line x1="390" y1="435" x2="360" y2="375"/>
    <line x1="470" y1="370" x2="500" y2="460"/>
    <line x1="470" y1="370" x2="450" y2="345"/>
    <line x1="420" y1="345" x2="480" y2="345"/>
  </g>
  <circle cx="390" cy="435" r="8" fill="#8338EC"/>
  <g stroke="#8338EC" stroke-width="4" stroke-linecap="round">
    <line x1="390" y1="435" x2="370" y2="450"/>
    <line x1="390" y1="435" x2="415" y2="420"/>
  </g>
  <rect x="363" y="450" width="14" height="6" fill="#333333"/>
  <rect x="408" y="414" width="14" height="6" fill="#333333"/>
  <rect x="348" y="366" width="20" height="8" rx="3" fill="#333333"/>

  <!-- front basket with fish -->
  <rect x="455" y="310" width="55" height="32" rx="4" fill="none" stroke="#8338EC" stroke-width="3"/>
  <g>
    <ellipse cx="483" cy="326" rx="17" ry="8" fill="#00B4D8"/>
    <path d="M466,326 L456,318 L456,334 Z" fill="#00B4D8"/>
    <circle cx="492" cy="323" r="1.6" fill="#003049"/>
  </g>

  <!-- pelican legs/feet on pedals -->
  <g stroke="#333333" stroke-width="4" stroke-linecap="round">
    <line x1="345" y1="385" x2="370" y2="450"/>
    <line x1="345" y1="385" x2="415" y2="420"/>
  </g>
  <path d="M362,452 L378,452 L384,460 L372,462 L358,460 Z" fill="#FB8500"/>
  <path d="M407,422 L423,422 L429,430 L417,432 L403,430 Z" fill="#FB8500"/>

  <!-- pelican wing reaching to handlebar -->
  <path d="M388,305 C 415,300 435,320 450,345" stroke="#333333" stroke-width="3" fill="none"/>

  <!-- pelican neck -->
  <path d="M365,290 C 400,255 420,235 456,236" stroke="#F1F1F1" stroke-width="36" stroke-linecap="round" fill="none"/>

  <!-- pelican body -->
  <ellipse cx="345" cy="330" rx="48" ry="58" fill="#F1F1F1" stroke="#333333" stroke-width="2"/>

  <!-- pelican scarf -->
  <path d="M368,268 Q392,290 418,268 Q402,246 376,252 Z" fill="#F95738"/>
  <path d="M396,278 Q382,308 366,330 Q388,320 403,294 Z" fill="#F95738"/>

  <!-- pelican head -->
  <circle cx="465" cy="232" r="24" fill="#F1F1F1" stroke="#333333" stroke-width="2"/>
  <circle cx="472" cy="226" r="3" fill="#222222"/>

  <!-- pelican beak -->
  <path d="M486,228 L548,213 L548,222 Q 520,248 486,240 Z" fill="#FB8500" stroke="#333333" stroke-width="1.5"/>
  <path d="M490,236 Q517,252 542,219" stroke="#333333" stroke-width="1" fill="none"/>
</svg>
