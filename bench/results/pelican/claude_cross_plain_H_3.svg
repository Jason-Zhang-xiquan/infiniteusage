<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<!-- iu-pelican-v3 -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="800" height="600" fill="url(#skyGradient)" />

  <!-- Sun with 8 straight rays -->
  <g>
    <line x1="110" y1="90" x2="110" y2="50" stroke="#FB8500" stroke-width="4" />
    <line x1="110" y1="90" x2="138" y2="62" stroke="#FB8500" stroke-width="4" />
    <line x1="110" y1="90" x2="150" y2="90" stroke="#FB8500" stroke-width="4" />
    <line x1="110" y1="90" x2="138" y2="118" stroke="#FB8500" stroke-width="4" />
    <line x1="110" y1="90" x2="110" y2="130" stroke="#FB8500" stroke-width="4" />
    <line x1="110" y1="90" x2="82" y2="118" stroke="#FB8500" stroke-width="4" />
    <line x1="110" y1="90" x2="70" y2="90" stroke="#FB8500" stroke-width="4" />
    <line x1="110" y1="90" x2="82" y2="62" stroke="#FB8500" stroke-width="4" />
    <circle cx="110" cy="90" r="32" fill="#FFB703" />
  </g>

  <!-- Cloud -->
  <g fill="#F1FAEE" opacity="0.8">
    <ellipse cx="620" cy="100" rx="55" ry="28" />
    <ellipse cx="660" cy="90" rx="40" ry="24" />
    <ellipse cx="580" cy="95" rx="35" ry="20" />
  </g>

  <!-- Birds (exactly 7) -->
  <g stroke="#2B2D42" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 250 70 Q 260 58 270 70 Q 280 58 290 70" />
    <path d="M 320 50 Q 330 38 340 50 Q 350 38 360 50" />
    <path d="M 400 90 Q 410 78 420 90 Q 430 78 440 90" />
    <path d="M 480 60 Q 490 48 500 60 Q 510 48 520 60" />
    <path d="M 550 130 Q 560 118 570 130 Q 580 118 590 130" />
    <path d="M 200 140 Q 210 128 220 140 Q 230 128 240 140" />
    <path d="M 440 150 Q 450 138 460 150 Q 470 138 480 150" />
  </g>

  <!-- Ground -->
  <line x1="0" y1="500" x2="800" y2="500" stroke="#4A4E69" stroke-width="3" stroke-dasharray="12 8" />
  <rect x="0" y="500" width="800" height="100" fill="#6B9B5B" />

  <!-- Roadside sign -->
  <g>
    <rect x="650" y="400" width="10" height="100" fill="#8D6E63" />
    <rect x="610" y="370" width="100" height="45" fill="#FFFFFF" stroke="#333333" stroke-width="3" />
    <text x="660" y="398" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333333" text-anchor="middle">IU-46</text>
    <!-- Ladybug on top of sign -->
    <g transform="translate(660,364)">
      <ellipse cx="0" cy="0" rx="7" ry="5.5" fill="#D7263D" />
      <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#1B1B1B" stroke-width="1" />
      <circle cx="-3" cy="-2" r="1.2" fill="#1B1B1B" />
      <circle cx="3" cy="-2" r="1.2" fill="#1B1B1B" />
      <circle cx="-3" cy="2" r="1.2" fill="#1B1B1B" />
      <circle cx="3" cy="2" r="1.2" fill="#1B1B1B" />
      <circle cx="0" cy="-6" r="2.2" fill="#1B1B1B" />
    </g>
  </g>

  <!-- Bicycle -->
  <g>
    <!-- Wheels -->
    <g>
      <circle cx="330" cy="460" r="55" fill="none" stroke="#333333" stroke-width="5" />
      <circle cx="330" cy="460" r="7" fill="#333333" />
      <!-- 6 spokes -->
      <line x1="330" y1="460" x2="330" y2="405" stroke="#5C677D" stroke-width="2" />
      <line x1="330" y1="460" x2="377.6" y2="432.5" stroke="#5C677D" stroke-width="2" />
      <line x1="330" y1="460" x2="377.6" y2="487.5" stroke="#5C677D" stroke-width="2" />
      <line x1="330" y1="460" x2="330" y2="515" stroke="#5C677D" stroke-width="2" />
      <line x1="330" y1="460" x2="282.4" y2="487.5" stroke="#5C677D" stroke-width="2" />
      <line x1="330" y1="460" x2="282.4" y2="432.5" stroke="#5C677D" stroke-width="2" />
    </g>
    <g>
      <circle cx="520" cy="460" r="55" fill="none" stroke="#333333" stroke-width="5" />
      <circle cx="520" cy="460" r="7" fill="#333333" />
      <!-- 6 spokes -->
      <line x1="520" y1="460" x2="520" y2="405" stroke="#5C677D" stroke-width="2" />
      <line x1="520" y1="460" x2="567.6" y2="432.5" stroke="#5C677D" stroke-width="2" />
      <line x1="520" y1="460" x2="567.6" y2="487.5" stroke="#5C677D" stroke-width="2" />
      <line x1="520" y1="460" x2="520" y2="515" stroke="#5C677D" stroke-width="2" />
      <line x1="520" y1="460" x2="472.4" y2="487.5" stroke="#5C677D" stroke-width="2" />
      <line x1="520" y1="460" x2="472.4" y2="432.5" stroke="#5C677D" stroke-width="2" />
    </g>

    <!-- Frame -->
    <g stroke="#8338EC" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="330" y1="460" x2="430" y2="400" />
      <line x1="430" y1="400" x2="520" y2="460" />
      <line x1="330" y1="460" x2="460" y2="460" />
      <line x1="460" y1="460" x2="520" y2="460" />
      <line x1="430" y1="400" x2="460" y2="460" />
      <line x1="460" y1="460" x2="490" y2="380" />
    </g>
    <!-- Seat -->
    <ellipse cx="430" cy="395" rx="16" ry="6" fill="#333333" />
    <line x1="430" y1="400" x2="430" y2="395" stroke="#8338EC" stroke-width="6" />
    <!-- Handlebar -->
    <line x1="490" y1="380" x2="505" y2="378" stroke="#333333" stroke-width="5" stroke-linecap="round" />
    <line x1="490" y1="380" x2="478" y2="378" stroke="#333333" stroke-width="5" stroke-linecap="round" />
    <!-- Pedal/crank -->
    <circle cx="460" cy="460" r="8" fill="#333333" />
    <line x1="460" y1="460" x2="478" y2="478" stroke="#333333" stroke-width="4" />
    <line x1="460" y1="460" x2="442" y2="442" stroke="#333333" stroke-width="4" />

    <!-- Front basket -->
    <g>
      <path d="M 480 345 L 520 345 L 515 375 L 485 375 Z" fill="none" stroke="#8D6E63" stroke-width="4" />
      <line x1="486" y1="355" x2="514" y2="355" stroke="#8D6E63" stroke-width="2" />
      <line x1="488" y1="365" x2="512" y2="365" stroke="#8D6E63" stroke-width="2" />
      <!-- Fish in basket -->
      <g transform="translate(500,358) rotate(-10)">
        <path d="M -16 0 Q -6 -10 10 0 Q -6 10 -16 0 Z" fill="#00B4D8" />
        <path d="M 10 0 L 18 -6 L 18 6 Z" fill="#00B4D8" />
        <circle cx="-10" cy="-1" r="1.5" fill="#0B132B" />
      </g>
    </g>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Legs -->
    <line x1="420" y1="430" x2="415" y2="460" stroke="#FFA62B" stroke-width="5" />
    <line x1="440" y1="430" x2="450" y2="460" stroke="#FFA62B" stroke-width="5" />

    <!-- Tail -->
    <path d="M 390 330 Q 360 335 355 355 Q 380 350 400 340 Z" fill="#E8E8E8" />

    <!-- Body -->
    <ellipse cx="420" cy="340" rx="65" ry="55" fill="#FFFFFF" />

    <!-- Wing -->
    <path d="M 400 310 Q 440 300 460 345 Q 430 360 395 350 Z" fill="#E0E0E0" />

    <!-- Scarf -->
    <path d="M 450 300 Q 470 305 468 325 Q 460 320 452 330 Q 448 312 450 300 Z" fill="#F95738" />
    <path d="M 452 302 Q 448 320 436 332" stroke="#F95738" stroke-width="10" fill="none" stroke-linecap="round" />

    <!-- Neck -->
    <path d="M 455 300 Q 480 260 500 235" stroke="#FFFFFF" stroke-width="30" fill="none" stroke-linecap="round" />

    <!-- Head -->
    <circle cx="505" cy="222" r="30" fill="#FFFFFF" />

    <!-- Pouch under beak -->
    <path d="M 520 232 Q 560 245 575 232 Q 560 250 525 248 Z" fill="#FFD23F" />

    <!-- Beak -->
    <path d="M 515 215 L 585 222 L 517 232 Z" fill="#FB8500" />
    <path d="M 515 215 L 585 222" stroke="#E07400" stroke-width="1.5" />

    <!-- Eye -->
    <circle cx="512" cy="213" r="4" fill="#0B132B" />
  </g>
</svg>
