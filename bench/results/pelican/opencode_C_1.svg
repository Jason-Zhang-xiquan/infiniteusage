<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Pelican riding a bicycle</title>
  <desc id="desc">A pelican with an orange scarf rides a purple bicycle past an IU-43 roadside sign under a warm sky.</desc>

  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#06D6A0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="800" height="600" fill="url(#skyGradient)"/>

  <!-- Sun -->
  <circle cx="104" cy="94" r="72" fill="#FFD166" opacity="0.28"/>
  <g stroke="#F4A261" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="170" y1="94" x2="188" y2="94"/>
    <line x1="155" y1="45" x2="170" y2="28"/>
    <line x1="104" y1="28" x2="104" y2="10"/>
    <line x1="53" y1="45" x2="38" y2="28"/>
    <line x1="38" y1="94" x2="20" y2="94"/>
    <line x1="53" y1="143" x2="38" y2="160"/>
    <line x1="104" y1="160" x2="104" y2="178"/>
    <line x1="155" y1="143" x2="170" y2="160"/>
  </g>
  <circle cx="104" cy="94" r="52" fill="#FFB703"/>

  <!-- Clouds -->
  <path d="M 612 218 C 624 198 652 197 664 214 C 684 209 699 221 700 236 L 604 236 C 600 225 604 220 612 218 Z"
        fill="#FFF8E7" opacity="0.38"/>
  <path d="M 350 170 C 360 154 382 153 392 166 C 407 162 418 171 419 183 L 343 183 C 340 175 343 172 350 170 Z"
        fill="#FFF8E7" opacity="0.28"/>

  <!-- Five birds -->
  <g fill="none" stroke="#2B2D42" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 472 137 q 13 -11 26 0 q 13 -11 26 0"/>
    <path d="M 529 82 q 11 -9 22 0 q 11 -9 22 0"/>
    <path d="M 576 116 q 14 -12 28 0 q 14 -12 28 0"/>
    <path d="M 650 91 q 11 -9 22 0 q 11 -9 22 0"/>
    <path d="M 706 148 q 13 -11 26 0 q 13 -11 26 0"/>
  </g>

  <!-- Roadside sign -->
  <line x1="139" y1="394" x2="139" y2="521" stroke="#7F5539" stroke-width="10" stroke-linecap="round"/>
  <g transform="rotate(-2 140 355)">
    <rect x="74" y="321" width="132" height="72" rx="8" fill="#FFF8E7" stroke="#1D3557" stroke-width="5"/>
    <text x="140" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32"
          font-weight="700" fill="#1D3557">IU-43</text>
  </g>

  <!-- Ground -->
  <rect x="0" y="520" width="800" height="80" fill="#95D5B2"/>
  <path d="M 0 516 C 150 500 260 514 390 508 C 535 501 660 514 800 502 L 800 522 L 0 522 Z"
        fill="#B7E4C7" opacity="0.7"/>
  <line x1="34" y1="525" x2="766" y2="525" stroke="#1D3557" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="12 8"/>

  <ellipse cx="402" cy="522" rx="191" ry="12" fill="#1D3557" opacity="0.12"/>

  <!-- Bicycle -->
  <g>
    <!-- Rear wheel -->
    <circle cx="272" cy="440" r="77" fill="none" stroke="#1D3557" stroke-width="9"/>
    <g stroke="#5C677D" stroke-width="3.2" stroke-linecap="round">
      <line x1="272" y1="440" x2="324.83" y2="470.5"/>
      <line x1="272" y1="440" x2="272" y2="501"/>
      <line x1="272" y1="440" x2="219.17" y2="470.5"/>
      <line x1="272" y1="440" x2="219.17" y2="409.5"/>
      <line x1="272" y1="440" x2="272" y2="379"/>
      <line x1="272" y1="440" x2="324.83" y2="409.5"/>
    </g>
    <circle cx="272" cy="440" r="64" fill="none" stroke="#457B9D" stroke-width="4"/>
    <circle cx="272" cy="440" r="8" fill="#1D3557"/>

    <!-- Front wheel -->
    <circle cx="532" cy="440" r="77" fill="none" stroke="#1D3557" stroke-width="9"/>
    <g stroke="#5C677D" stroke-width="3.2" stroke-linecap="round">
      <line x1="532" y1="440" x2="584.83" y2="470.5"/>
      <line x1="532" y1="440" x2="532" y2="501"/>
      <line x1="532" y1="440" x2="479.17" y2="470.5"/>
      <line x1="532" y1="440" x2="479.17" y2="409.5"/>
      <line x1="532" y1="440" x2="532" y2="379"/>
      <line x1="532" y1="440" x2="584.83" y2="409.5"/>
    </g>
    <circle cx="532" cy="440" r="64" fill="none" stroke="#457B9D" stroke-width="4"/>
    <circle cx="532" cy="440" r="8" fill="#1D3557"/>

    <!-- Frame -->
    <g fill="none" stroke="#8338EC" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 272 440 L 405 445"/>
      <path d="M 272 440 L 340 322"/>
      <path d="M 340 322 L 405 445"/>
      <path d="M 405 445 L 494 322"/>
      <path d="M 340 322 L 494 322"/>
      <path d="M 494 322 L 512 376"/>
      <path d="M 512 376 L 532 440"/>
    </g>

    <!-- Chain and crank -->
    <path d="M 272 440 Q 338 462 405 445" fill="none" stroke="#6D597A" stroke-width="3" opacity="0.85"/>
    <circle cx="405" cy="445" r="22" fill="none" stroke="#7F5539" stroke-width="4"/>
    <circle cx="405" cy="445" r="13" fill="#1D3557"/>
    <line x1="405" y1="445" x2="385" y2="425" stroke="#1D3557" stroke-width="6" stroke-linecap="round"/>
    <line x1="405" y1="445" x2="425" y2="465" stroke="#1D3557" stroke-width="6" stroke-linecap="round"/>
    <rect x="372" y="421" width="26" height="8" rx="3" fill="#1D3557"/>
    <rect x="413" y="461" width="26" height="8" rx="3" fill="#1D3557"/>

    <!-- Seat and handlebar -->
    <line x1="340" y1="322" x2="337" y2="305" stroke="#1D3557" stroke-width="7" stroke-linecap="round"/>
    <path d="M 315 302 Q 338 292 365 302 L 360 313 Q 338 307 319 313 Z" fill="#1D3557"/>
    <line x1="494" y1="322" x2="500" y2="302" stroke="#1D3557" stroke-width="7" stroke-linecap="round"/>
    <path d="M 474 302 Q 500 288 524 300" fill="none" stroke="#1D3557" stroke-width="7" stroke-linecap="round"/>
    <circle cx="474" cy="302" r="5" fill="#1D3557"/>
    <circle cx="524" cy="300" r="5" fill="#1D3557"/>
  </g>

  <!-- Pelican -->
  <g>
    <!-- Tail and legs -->
    <path d="M 331 295 C 311 285 298 280 289 282 C 296 295 296 310 290 323 C 310 319 329 321 346 328 Z"
          fill="#F1F2E8" stroke="#1D3557" stroke-width="5" stroke-linejoin="round"/>
    <path d="M 382 334 C 372 361 373 393 385 425" fill="none" stroke="#F4A261" stroke-width="9" stroke-linecap="round"/>
    <path d="M 419 334 C 430 369 432 426 425 465" fill="none" stroke="#F4A261" stroke-width="9" stroke-linecap="round"/>
    <path d="M 374 423 L 398 421 L 391 434 Z" fill="#F4A261" stroke="#1D3557" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 413 461 L 438 459 L 430 472 Z" fill="#F4A261" stroke="#1D3557" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Body -->
    <path d="M 323 303 C 322 266 346 238 387 233 C 428 228 458 251 464 288 C 470 321 448 341 414 347
             C 379 353 340 342 326 323 C 321 316 320 309 323 303 Z"
          fill="#FFF8E7" stroke="#1D3557" stroke-width="5" stroke-linejoin="round"/>

    <!-- Folded wing -->
    <path d="M 366 262 C 392 248 431 252 449 279 C 438 303 405 316 374 306 C 354 298 351 275 366 262 Z"
          fill="#E9ECEF" stroke="#1D3557" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 381 270 C 397 266 418 270 432 282 M 376 283 C 392 281 410 285 424 294"
          fill="none" stroke="#BCC4CC" stroke-width="2" stroke-linecap="round"/>

    <!-- Neck and head -->
    <path d="M 425 252 C 444 247 451 225 454 203 C 456 185 463 170 476 164 C 486 159 496 165 501 175
             L 490 203 C 477 201 471 212 468 232 C 464 259 455 281 442 291 Z"
          fill="#FFF8E7" stroke="#1D3557" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="490" cy="176" rx="37" ry="32" fill="#FFF8E7" stroke="#1D3557" stroke-width="5"/>
    <circle cx="504" cy="169" r="5.5" fill="#1D3557"/>
    <circle cx="506" cy="167" r="1.7" fill="#FFFFFF"/>

    <!-- Beak and pouch -->
    <path d="M 520 166 C 552 163 594 174 632 194 C 612 202 572 202 537 196 L 520 188 Z"
          fill="#F4A261" stroke="#1D3557" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 519 189 C 541 203 577 210 608 203 C 592 220 556 225 526 213 C 519 208 516 198 519 189 Z"
          fill="#E9C46A" stroke="#1D3557" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 543 176 Q 556 174 570 178" fill="none" stroke="#1D3557" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Scarf -->
    <path d="M 448 224 C 424 219 405 225 386 235 C 404 243 424 244 448 239 Z"
          fill="#E4572E" stroke="#C1121F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 443 236 C 418 242 402 254 387 265 C 409 266 428 257 444 248 Z"
          fill="#E4572E" stroke="#C1121F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 439 215 C 454 210 472 213 485 224 L 481 242 C 467 233 453 232 438 237 Z"
          fill="#E4572E" stroke="#C1121F" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 391 238 L 383 241 M 392 262 L 384 266" fill="none" stroke="#C1121F" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Fish and front basket -->
  <g>
    <line x1="500" y1="303" x2="520" y2="337" stroke="#1D3557" stroke-width="5" stroke-linecap="round"/>
    <line x1="512" y1="376" x2="540" y2="384" stroke="#1D3557" stroke-width="5" stroke-linecap="round"/>

    <g transform="rotate(-20 552 316)">
      <path d="M 521 316 L 496 300 L 500 332 Z" fill="#3A86FF" stroke="#1D3557" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="552" cy="316" rx="34" ry="17" fill="#3A86FF" stroke="#1D3557" stroke-width="3"/>
      <path d="M 548 301 Q 557 288 566 300 Z" fill="#1D3557"/>
      <circle cx="570" cy="311" r="3.2" fill="#1D3557"/>
      <circle cx="571" cy="310" r="1" fill="#FFFFFF"/>
    </g>

    <path d="M 512 332 L 596 332 L 585 388 Q 550 396 523 388 Z"
          fill="#D4A373" stroke="#7F5539" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 534 344 L 529 386 M 554 344 L 552 389 M 574 344 L 575 386 M 518 352 L 590 352 M 521 368 L 587 368"
          fill="none" stroke="#B08968" stroke-width="2" opacity="0.8"/>
    <rect x="506" y="326" width="98" height="13" rx="6" fill="#B08968" stroke="#7F5539" stroke-width="3"/>
  </g>
</svg>
